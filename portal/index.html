<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal | TSAM AI</title>
  <meta name="description" content="TSAM AIのポータルです。">

  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="color-scheme" content="light">

  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../auth/auth.css">
</head>
<body class="auth-page">
  <a class="skip-link" href="#main-content">本文へスキップ</a>

  <!--
    Portal だけは上端から詰める。
    他の画面は入力欄が数個の縦センタリングで収まるが、
    Portal は一覧が伸びるため、中央寄せだと上に大きな空白ができる。
  -->
  <main id="main-content" class="auth-main auth-main--top" tabindex="-1">
    <div class="auth-shell auth-shell--wide">
      <!--
        保護対象の内容は、サーバーがセッションを有効と答えるまで出さない。
        既定を hidden にしておき、portal.js が確認後に外す。
      -->
      <p class="auth-loading" id="portal-loading">ログイン状態を確認しています…</p>

      <div id="portal-content" hidden>
        <!--
          ブランドブロック（TSAM AI／社名）は置かない。
          ログイン後の作業画面であり、名乗り直すより
          アプリを選ぶまでの距離を縮めるほうを優先する。
          社名はフッターに残している。
        -->
        <div class="auth-portal-bar">
          <div class="auth-portal-bar__identity">
            <!--
              見出しがボタンを包む形にしている（W3C APG の開閉パネルと同じ）。
              button の中身は読み上げ上ひとかたまりに潰れるため、h1 を
              button の内側に入れると見出しとして拾えなくなる。
              包む向きなら「Portal（見出し）」と「Portal（ボタン・折りたたみ）」の
              両方が残る。詳細は docs/specs/portal-spec-v1.md §3-3。
            -->
            <h1 class="auth-portal-bar__title">
              <button class="auth-portal-bar__toggle" id="portal-account-toggle" type="button"
                      aria-expanded="false" aria-controls="portal-account-panel">
                Portal
                <svg class="auth-portal-bar__chevron" viewBox="0 0 24 24" width="16" height="16"
                     fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                  <path d="m6 9 6 6 6-6"></path>
                </svg>
              </button>
            </h1>
            <span id="portal-user-badge" hidden></span>
          </div>
          <button class="auth-button auth-button--ghost auth-portal-bar__logout" id="portal-logout" type="button">ログアウト</button>
        </div>

        <!--
          アカウント情報。ヘッダーバー直下の開閉パネル。
          初期状態は閉じたまま配信し、portal.js が開閉を切り替える。
          開閉状態は保存しない（再読み込みで閉に戻る）。
        -->
        <section class="auth-account" id="portal-account-panel"
                 aria-labelledby="portal-account-title" hidden>
          <h2 class="auth-account__title" id="portal-account-title">アカウント情報</h2>
          <dl class="auth-account__list">
            <div>
              <dt>メールアドレス</dt>
              <dd id="portal-account-email"></dd>
            </div>
            <div>
              <dt>ご契約の状態</dt>
              <dd id="portal-account-subscription"></dd>
            </div>
            <div>
              <dt>パスワード</dt>
              <dd><a href="../password/reset/">パスワードを変更する</a></dd>
            </div>
          </dl>
        </section>

        <p class="auth-message" id="portal-message" tabindex="-1" hidden></p>

        <!--
          APIキー未設定の警告。
          キー管理画面が未実装のあいだは表示しない（行き先のない導線を出さない）。
          表示条件は portal.js の shouldShowApiKeyBanner() にある。
          詳細は docs/specs/portal-spec-v1.md §5。
        -->
        <div class="auth-portal-banner" id="portal-api-key-banner" role="status" hidden>
          <svg class="auth-portal-banner__icon" viewBox="0 0 24 24" width="20" height="20"
               fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <circle cx="8" cy="15" r="4"></circle>
            <path d="M10.9 12.1 20 3"></path>
            <path d="M17 6l2.5 2.5"></path>
            <path d="M14.5 8.5 17 11"></path>
          </svg>
          <p class="auth-portal-banner__body">Gemini APIキーが未設定です。</p>
          <a class="auth-portal-banner__action" id="portal-api-key-link" href="">APIキーを設定する</a>
        </div>

        <ul class="auth-apps" id="portal-apps"></ul>

        <p class="auth-loading" id="portal-apps-empty" hidden>
          ご利用可能なアプリは順次追加されます。
        </p>
      </div>

      <noscript>
        <p class="auth-message" data-kind="error" style="margin-top:20px">
          <strong class="auth-message__label">エラー</strong>
          <span class="auth-message__body">JavaScriptが無効なため、Portalを表示できません。ブラウザの設定でJavaScriptを有効にしてください。</span>
        </p>
      </noscript>
    </div>
  </main>

  <footer class="auth-footer">
    <p><a href="../index.html">TSアセットマネジメント合同会社</a></p>
    <p><small>Copyright &copy; TS Asset Management LLC. All Rights Reserved.</small></p>
  </footer>

  <script type="module" src="portal.js"></script>
</body>
</html>
