<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal | TSAM AI</title>
  <meta name="description" content="TSAM AIのポータルです。">

  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="color-scheme" content="light">

  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../auth/auth.css">
</head>
<body class="auth-page">
  <a class="skip-link" href="#main-content">本文へスキップ</a>

  <main id="main-content" class="auth-main" tabindex="-1">
    <div class="auth-shell auth-shell--wide">
      <!--
        保護対象の内容は、サーバーがセッションを有効と答えるまで出さない。
        既定を hidden にしておき、portal.js が確認後に外す。
      -->
      <p class="auth-loading" id="portal-loading">ログイン状態を確認しています…</p>

      <div id="portal-content" hidden>
        <div class="auth-brand">
          <a class="auth-brand__link" href="../index.html">
            <span class="auth-brand__name" lang="en">TSAM AI</span>
          </a>
          <p class="auth-brand__owner">TSアセットマネジメント合同会社</p>
        </div>

        <div class="auth-portal-header">
          <p class="auth-portal-header__user">
            <span id="portal-user-email"></span>
            <span id="portal-user-badge" hidden></span>
          </p>
          <div class="auth-portal-header__actions">
            <button class="auth-button auth-button--ghost" id="portal-logout" type="button">ログアウト</button>
          </div>
        </div>

        <h1 class="auth-card__title">Portal</h1>
        <p class="auth-card__lead">ご利用になるアプリを選択してください。</p>

        <p class="auth-message" id="portal-message" tabindex="-1" hidden></p>

        <ul class="auth-apps" id="portal-apps"></ul>

        <p class="auth-loading" id="portal-apps-empty" hidden>
          ご利用可能なアプリは順次追加されます。
        </p>

        <section class="auth-terms" aria-labelledby="portal-account-title">
          <h2 class="auth-terms__title" id="portal-account-title">アカウント情報</h2>
          <dl class="auth-terms__list">
            <div>
              <dt>メールアドレス</dt>
              <dd id="portal-account-email"></dd>
            </div>
            <div>
              <dt>ご契約の状態</dt>
              <dd id="portal-account-subscription"></dd>
            </div>
            <div>
              <dt>パスワード</dt>
              <dd><a href="../password/reset/">パスワードを変更する</a></dd>
            </div>
          </dl>
        </section>
      </div>

      <noscript>
        <p class="auth-message" data-kind="error" style="margin-top:20px">
          <strong class="auth-message__label">エラー</strong>
          <span class="auth-message__body">JavaScriptが無効なため、Portalを表示できません。ブラウザの設定でJavaScriptを有効にしてください。</span>
        </p>
      </noscript>
    </div>
  </main>

  <footer class="auth-footer">
    <p><a href="../index.html">TSアセットマネジメント合同会社</a></p>
    <p><small>Copyright &copy; TS Asset Management LLC. All Rights Reserved.</small></p>
  </footer>

  <script type="module" src="portal.js"></script>
</body>
</html>
