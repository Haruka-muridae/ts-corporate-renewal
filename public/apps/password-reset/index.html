<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>パスワードの再設定 | TSAM AI</title>
  <meta name="description" content="TSAM AIのパスワードを再設定します。">

  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="color-scheme" content="light">

  <link rel="icon" href="../../favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../../favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../../favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../../apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../account.css">
</head>
<body class="account-page">
  <a class="skip-link" href="#main-content">本文へスキップ</a>

  <main id="main-content" class="account-main" tabindex="-1">
    <div class="account-shell">
      <div class="account-brand">
        <a class="account-brand__link" href="../../index.html">
          <span class="account-brand__name" lang="en">TSAM AI</span>
        </a>
        <p class="account-brand__owner">TSアセットマネジメント合同会社</p>
      </div>

      <div class="account-card">
        <!--
          第1段階: メールアドレスを入れて再設定メールを送る。
          第2段階: メール内リンクから戻ってきて、新しいパスワードを設定する。
          どちらを出すかは reset.js が判断する。
        -->
        <section id="reset-step-request">
          <h1 class="account-card__title">パスワードの再設定</h1>
          <p class="account-card__lead">登録しているメールアドレスへ、再設定用のリンクをお送りします。</p>

          <p class="account-notice" id="reset-unavailable" hidden>
            <strong class="account-notice__label">準備中</strong>
            <span id="reset-unavailable-reason">パスワードの再設定は現在ご利用いただけません。</span>
          </p>

          <form class="account-form" id="reset-request-form" novalidate>
            <div class="field">
              <label class="field__label" for="reset-email">メールアドレス</label>
              <input
                class="field__input"
                id="reset-email"
                name="email"
                type="email"
                inputmode="email"
                autocomplete="username"
                autocapitalize="none"
                autocorrect="off"
                spellcheck="false"
                maxlength="254"
                required
              >
            </div>

            <p class="account-message" id="reset-request-message" tabindex="-1" hidden></p>

            <button class="account-button" id="reset-request-submit" type="submit">再設定メールを送る</button>
          </form>

          <div class="account-links">
            <ul class="account-links__list">
              <li><a href="../login/">ログイン画面へ戻る</a></li>
            </ul>
          </div>
        </section>

        <!-- 第2段階: 新しいパスワードの設定。 -->
        <section id="reset-step-set" hidden>
          <h1 class="account-card__title">新しいパスワード</h1>
          <p class="account-card__lead" id="reset-set-lead">新しいパスワードを設定してください。</p>

          <form class="account-form" id="reset-set-form" novalidate>
            <div class="field">
              <label class="field__label" for="reset-password">新しいパスワード</label>
              <div class="field__control">
                <input
                  class="field__input"
                  id="reset-password"
                  name="newPassword"
                  type="password"
                  autocomplete="new-password"
                  autocapitalize="none"
                  spellcheck="false"
                  maxlength="72"
                  required
                  aria-describedby="reset-password-hint"
                >
                <button
                  class="field__toggle"
                  id="reset-password-toggle"
                  type="button"
                  aria-pressed="false"
                  aria-controls="reset-password"
                >表示</button>
              </div>
              <p class="field__hint" id="reset-password-hint">8文字以上で入力します。</p>
            </div>

            <div class="field">
              <label class="field__label" for="reset-password-confirm">新しいパスワード（確認）</label>
              <input
                class="field__input"
                id="reset-password-confirm"
                name="newPasswordConfirm"
                type="password"
                autocomplete="new-password"
                autocapitalize="none"
                spellcheck="false"
                maxlength="72"
                required
              >
            </div>

            <p class="account-message" id="reset-set-message" tabindex="-1" hidden></p>

            <button class="account-button" id="reset-set-submit" type="submit">パスワードを設定する</button>
          </form>
        </section>
      </div>

      <noscript>
        <p class="account-message" style="margin-top:20px">
          JavaScriptが無効なため、この画面は利用できません。ブラウザの設定でJavaScriptを有効にしてください。
        </p>
      </noscript>
    </div>
  </main>

  <footer class="account-footer">
    <p><a href="../../index.html">TSアセットマネジメント合同会社</a></p>
    <p><small>Copyright &copy; TS Asset Management LLC. All Rights Reserved.</small></p>
  </footer>

  <script type="module" src="reset.js"></script>
</body>
</html>
