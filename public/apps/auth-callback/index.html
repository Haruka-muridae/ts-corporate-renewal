<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>確認しています | TSAM AI</title>

  <!--
    このURLにはメール内リンクの一度きりのコードが付く。
    検索エンジンに拾わせず、リファラも外部へ渡さない。
  -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light">

  <link rel="icon" href="../../favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../../favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../../favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../../apple-touch-icon.png">

  <!--
    この画面だけ外部フォントを読み込まない。

    URLにメール内リンクの一度きりのコードが載った状態で描画されるため、
    第三者への通信をひとつも発生させない。
    （referrer は no-referrer に設定済みだが、そもそも通信を作らない。）

    表示が一瞬で終わる中継画面のため、システムフォントで足りる。
  -->
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../account.css">
</head>
<body class="account-page">
  <a class="skip-link" href="#main-content">本文へスキップ</a>

  <main id="main-content" class="account-main" tabindex="-1">
    <div class="account-shell">
      <div class="account-brand">
        <span class="account-brand__name" lang="en">TSAM AI</span>
      </div>

      <div class="account-card">
        <h1 class="account-card__title" id="callback-title">確認しています</h1>
        <p class="account-card__lead" id="callback-lead">しばらくお待ちください。</p>

        <p class="account-message" id="callback-message" tabindex="-1" hidden></p>

        <!-- 失敗したときの戻り先。成功時は自動遷移するため表示しない。 -->
        <div class="account-links" id="callback-links" hidden>
          <ul class="account-links__list">
            <li><a href="../login/">ログイン画面へ戻る</a></li>
            <li><a href="../password-reset/">パスワードの再設定をやり直す</a></li>
          </ul>
        </div>
      </div>

      <noscript>
        <p class="account-message" style="margin-top:20px">
          JavaScriptが無効なため、この画面は利用できません。ブラウザの設定でJavaScriptを有効にしてください。
        </p>
      </noscript>
    </div>
  </main>

  <footer class="account-footer">
    <p><a href="../../index.html">TSアセットマネジメント合同会社</a></p>
    <p><small>Copyright &copy; TS Asset Management LLC. All Rights Reserved.</small></p>
  </footer>

  <script type="module" src="callback.js"></script>
</body>
</html>
