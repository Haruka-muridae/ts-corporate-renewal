<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    制御レイヤーの抽象化。3層のうち中央（Security Enforcement Layer）だけ
    塗りつぶしの主色にする。ロボット等の具象は使わない（要件定義書 §17）。
  -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="#FAFAF8"/>
  <rect x="8" y="7" width="16" height="4.5" rx="2.25" fill="none" stroke="#567185" stroke-width="1.5"/>
  <rect x="6" y="13.75" width="20" height="4.5" rx="2.25" fill="#245B8A"/>
  <rect x="8" y="20.5" width="16" height="4.5" rx="2.25" fill="none" stroke="#567185" stroke-width="1.5"/>
</svg>
