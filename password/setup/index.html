<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>パスワードの初期設定 | TSAM AI</title>
  <meta name="description" content="TSAM AIのログイン用パスワードを設定します。">

  <meta name="robots" content="noindex, nofollow">
  <!--
    トークンを含むURLを外部へ渡さないよう、参照元は送らない。
    referrer で漏れると、リンクが第三者の手に渡る。
  -->
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light">

  <link rel="icon" href="../../favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../../favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../../favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../../apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../auth/auth.css">
</head>
<body class="auth-page">
  <a class="skip-link" href="#main-content">本文へスキップ</a>

  <main id="main-content" class="auth-main" tabindex="-1">
    <div class="auth-shell">
      <div class="auth-brand">
        <a class="auth-brand__link" href="../../index.html">
          <span class="auth-brand__name" lang="en">TSAM AI</span>
        </a>
        <p class="auth-brand__owner">TSアセットマネジメント合同会社</p>
      </div>

      <div class="auth-card">
        <h1 class="auth-card__title">パスワードの初期設定</h1>
        <p class="auth-card__lead">ログインに使用するパスワードを設定してください。</p>

        <p class="auth-message" id="setup-message" tabindex="-1" hidden></p>

        <form class="auth-form" id="setup-form" novalidate>
          <div class="auth-field">
            <label class="auth-field__label" for="setup-password">新しいパスワード</label>
            <div class="auth-field__control">
              <input
                class="auth-field__input"
                id="setup-password"
                name="password"
                type="password"
                autocomplete="new-password"
                autocapitalize="none"
                spellcheck="false"
                maxlength="128"
                required
                aria-describedby="setup-password-hint"
              >
              <button
                class="auth-field__toggle"
                id="setup-password-toggle"
                type="button"
                aria-pressed="false"
                aria-controls="setup-password"
              >表示</button>
            </div>
            <p class="auth-field__hint" id="setup-password-hint">12文字以上で設定してください。</p>
          </div>

          <div class="auth-field">
            <label class="auth-field__label" for="setup-confirm">新しいパスワード（確認用）</label>
            <div class="auth-field__control">
              <input
                class="auth-field__input"
                id="setup-confirm"
                name="passwordConfirm"
                type="password"
                autocomplete="new-password"
                autocapitalize="none"
                spellcheck="false"
                maxlength="128"
                required
              >
              <button
                class="auth-field__toggle"
                id="setup-confirm-toggle"
                type="button"
                aria-pressed="false"
                aria-controls="setup-confirm"
              >表示</button>
            </div>
          </div>

          <button class="auth-button" id="setup-submit" type="submit">パスワードを設定する</button>
        </form>

        <!-- 設定完了後に出す案内。ログインは自動で行わない。 -->
        <div id="setup-done" hidden>
          <a class="auth-button" href="../../login/">ログイン画面へ</a>
        </div>

        <div class="auth-links">
          <ul class="auth-links__list">
            <li><a href="../reset/">リンクの有効期限が切れた場合はこちら</a></li>
          </ul>
        </div>
      </div>

      <noscript>
        <p class="auth-message" data-kind="error" style="margin-top:20px">
          <strong class="auth-message__label">エラー</strong>
          <span class="auth-message__body">JavaScriptが無効なため、パスワードを設定できません。ブラウザの設定でJavaScriptを有効にしてください。</span>
        </p>
      </noscript>
    </div>
  </main>

  <footer class="auth-footer">
    <p><a href="../../index.html">TSアセットマネジメント合同会社</a></p>
    <p><small>Copyright &copy; TS Asset Management LLC. All Rights Reserved.</small></p>
  </footer>

  <script type="module" src="setup.js"></script>
</body>
</html>
