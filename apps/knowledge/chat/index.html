<!DOCTYPE html>

  <meta charset="UTF-8">

  <!--
    Content-Security-Policy（このページ専用）

    ------------------------------------------------------------------
    ナレッジ管理画面（../index.html）のCSPは一切変更していない。
    ここで緩めているのは、ブラウザ内LLMを動かすために必要な最小限だけ。
    ------------------------------------------------------------------

    script-src に 'wasm-unsafe-eval' を追加している。
      これは 'unsafe-eval' とは別物で、**WebAssembly のコンパイルだけ**を許可する。
      JavaScript の eval() / new Function() は許可されないままである。
      推論エンジン（MLC/TVM）は WebAssembly で動くため、これが無いと起動しない。

    connect-src に追加した3つは **モデルファイルの取得だけ** に使う。
      huggingface.co        … モデル定義と重みの入口
      *.hf.co               … 重みの実配信CDN（huggingface.co からのリダイレクト先）
      raw.githubusercontent.com … 推論ライブラリ（.wasm）
    いずれも GET のみ。質問文・資料本文・回答を送信することはない。
    Google Drive API（www.googleapis.com）はこのページからは呼ばない。

    'unsafe-inline' / 'unsafe-eval' は入れない。
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'none';
    script-src 'self' 'wasm-unsafe-eval';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: blob:;
    font-src 'self' data:;
    connect-src 'self' blob: data: https://huggingface.co https://*.hf.co https://raw.githubusercontent.com;
    worker-src 'self' blob:;
    child-src 'self' blob:;
    form-action 'none';
    base-uri 'self';
    object-src 'none';
  ">

  <!-- モデル配信元へ参照元情報を送らない。 -->
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light">
